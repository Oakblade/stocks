<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mina Aktier</title>
    <style>
        :root {
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --hover-bg: #f9fafb;
            --green: #10b981;
            --red: #ef4444;
            --muted: #6b7280;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 12px;
            background-color: transparent;
            color: var(--text-color);
            font-size: 13px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .refresh-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            color: var(--muted);
        }
        .refresh-btn:hover {
            background-color: var(--hover-bg);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 6px 4px;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            font-weight: 600;
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
        }
        .text-right {
            text-align: right;
        }
        .positive {
            color: var(--green);
            font-weight: 500;
        }
        .negative {
            color: var(--red);
            font-weight: 500;
        }
        .ticker-sub {
            font-size: 11px;
            color: var(--muted);
            display: block;
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .loading, .error {
            text-align: center;
            padding: 20px;
            color: var(--muted);
            font-size: 13px;
        }
        .error {
            color: var(--red);
        }
    </style>
</head>
<body>
    <div class="header">
        <span>Mina Aktier</span>
        <button class="refresh-btn" onclick="fetchStockData(true)">Uppdatera</button>
    </div>
    
    <div id="stock-container">
        <div class="loading">Laddar kurser...</div>
    </div>

    <script>
        const STOCKS = [
            { symbol: "ASSA-B.ST", name: "Assa Abloy" },
            { symbol: "AXFO.ST", name: "Axfood" },
            { symbol: "ESSITY-B.ST", name: "Essity" },
            { symbol: "HM-B.ST", name: "H&M" },
            { symbol: "HNSA.ST", name: "Hansa Bio" },
            { symbol: "INDU-C.ST", name: "Industrivärden C" },
            { symbol: "INVE-B.ST", name: "Investor B" },
            { symbol: "SHB-A.ST", name: "Handelsbanken A" },
            { symbol: "SEYE.ST", name: "Smart Eye" }
        ];

        const CACHE_KEY = "yahoo_v8_stock_cache";
        const CACHE_TIME_KEY = "yahoo_v8_stock_time";
        const CACHE_DURATION = 5 * 60 * 1000; // 5 minuter

        async function fetchSingleStock(stock) {
            const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${stock.symbol}?interval=1d&range=1d`;
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

            const res = await fetch(proxyUrl);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);

            const json = await res.json();
            const meta = json?.chart?.result?.[0]?.meta;
            if (!meta) throw new Error(`Ingen data`);

            const price = meta.regularMarketPrice;
            const prevClose = meta.chartPreviousClose || meta.previousClose;
            const change = price - prevClose;
            const changePercent = prevClose ? (change / prevClose) * 100 : 0;

            return {
                symbol: stock.symbol,
                name: stock.name,
                price,
                change,
                changePercent
            };
        }

        async function fetchStockData(forceRefresh = false) {
            const container = document.getElementById("stock-container");
            const now = Date.now();
            const cachedData = localStorage.getItem(CACHE_KEY);
            const cachedTime = localStorage.getItem(CACHE_TIME_KEY);

            if (!forceRefresh && cachedData && cachedTime && (now - cachedTime < CACHE_DURATION)) {
                renderTable(JSON.parse(cachedData));
                return;
            }

            try {
                const results = [];
                for (let i = 0; i < STOCKS.length; i++) {
                    const stock = STOCKS[i];
                    container.innerHTML = `<div class="loading">Laddar ${stock.name} (${i + 1}/${STOCKS.length})...</div>`;
                    
                    const data = await fetchSingleStock(stock);
                    results.push(data);
                    
                    // Kort paus på 250ms mellan anropen för att inte överbelasta proxyn
                    if (i < STOCKS.length - 1) {
                        await new Promise(resolve => setTimeout(resolve, 250));
                    }
                }

                localStorage.setItem(CACHE_KEY, JSON.stringify(results));
                localStorage.setItem(CACHE_TIME_KEY, now.toString());
                renderTable(results);
            } catch (err) {
                console.error("Fel vid hämtning:", err);
                if (cachedData) {
                    renderTable(JSON.parse(cachedData));
                } else {
                    container.innerHTML = `<div class="error">Kunde inte ladda kurser. Kontrollera nätverket.</div>`;
                }
            }
        }

        function renderTable(quotes) {
            const container = document.getElementById("stock-container");
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Aktie</th>
                            <th class="text-right">Senast</th>
                            <th class="text-right">Ändring</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            quotes.forEach(q => {
                const ticker = q.symbol.replace('.ST', '');
                const price = q.price !== undefined ? q.price.toFixed(2) : "-";
                const change = q.change !== undefined ? q.change.toFixed(2) : "0.00";
                const changePercent = q.changePercent !== undefined ? q.changePercent.toFixed(2) : "0.00";
                
                const isPos = q.change >= 0;
                const changeClass = isPos ? "positive" : "negative";
                const sign = isPos ? "+" : "";

                html += `
                    <tr>
                        <td>
                            <strong>${ticker}</strong>
                            <span class="ticker-sub" title="${q.name}">${q.name}</span>
                        </td>
                        <td class="text-right" style="vertical-align: middle;">${price} kr</td>
                        <td class="text-right" style="vertical-align: middle;">
                            <span class="${changeClass}">${sign}${change}<br><span style="font-size:11px;">(${sign}${changePercent}%)</span></span>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        fetchStockData();
    </script>
</body>
</html>
