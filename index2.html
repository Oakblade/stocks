<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mina Aktier</title>
    <style>
        :root {
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --hover-bg: #f9fafb;
            --green: #10b981;
            --red: #ef4444;
            --muted: #6b7280;
            --badge-bg: #f3f4f6;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text-color: #f3f4f6;
                --border-color: #374151;
                --hover-bg: #1f2937;
                --green: #34d399;
                --red: #f87171;
                --muted: #9ca3af;
                --badge-bg: #374151;
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 12px;
            background-color: transparent;
            color: var(--text-color);
            font-size: 13px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .status-text {
            font-size: 11px;
            font-weight: 400;
            color: var(--muted);
            margin-right: 8px;
        }
        .controls { display: flex; align-items: center; }
        .refresh-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            color: var(--muted);
        }
        .refresh-btn:hover { background-color: var(--hover-bg); color: var(--text-color); }
        .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 6px 4px; border-bottom: 1px solid var(--border-color); }
        th {
            font-weight: 600;
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
        }
        .text-right { text-align: right; }
        .positive { color: var(--green); font-weight: 500; }
        .negative { color: var(--red); font-weight: 500; }
        .ticker-sub {
            font-size: 11px;
            color: var(--muted);
            display: block;
            max-width: 130px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .error-banner {
            color: var(--red);
            font-size: 12px;
            padding: 8px;
            border: 1px solid var(--red);
            border-radius: 4px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <span>Mina Aktier</span>
        <div class="controls">
            <span id="status-text" class="status-text"></span>
            <button id="refresh-btn" class="refresh-btn" onclick="loadStocks()">Uppdatera</button>
        </div>
    </div>

    <div id="error-box"></div>
    <div id="stock-container"></div>

    <script>
        // Klistra in länken från Google Sheets: Arkiv → Dela → Publicera på webben → CSV
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTG0HUhqL1PjBqFDRtyK7hxUxNdtn-NOqTRtliAbF6Ol1JjrEtj3tdPPTGWNt3G3EHzJV0C9Zo6-bfe/pub?gid=0&single=true&output=csv";

        const AUTO_REFRESH_MS = 5 * 60 * 1000; // 5 minuter

        // Enkel CSV-parser som klarar citattecken (t.ex. "123,45")
        function parseCSV(text) {
            const rows = [];
            let row = [], field = "", inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (inQuotes) {
                    if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
                    else if (c === '"') inQuotes = false;
                    else field += c;
                } else if (c === '"') inQuotes = true;
                else if (c === ",") { row.push(field); field = ""; }
                else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
                else if (c !== "\r") field += c;
            }
            if (field || row.length) { row.push(field); rows.push(row); }
            return rows;
        }

        // Hanterar både "123.45" och svenska "123,45" / "1 234,56"
        function toNumber(s) {
            if (s == null) return NaN;
            const clean = String(s).replace(/[\s %]/g, "").replace("−", "-").replace(",", ".");
            return clean === "" ? NaN : Number(clean);
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }

        function setStatus(text) {
            document.getElementById("status-text").textContent = text;
        }

        function showError(msg) {
            document.getElementById("error-box").innerHTML =
                msg ? `<div class="error-banner">${msg}</div>` : "";
        }

        async function loadStocks() {
            const btn = document.getElementById("refresh-btn");

            if (!CSV_URL || CSV_URL.startsWith("KLISTRA_IN")) {
                showError("Lägg in länken till ditt publicerade Google Sheet (CSV) i <code>CSV_URL</code>.");
                return;
            }

            btn.disabled = true;
            setStatus("Hämtar...");

            try {
                const sep = CSV_URL.includes("?") ? "&" : "?";
                const res = await fetch(`${CSV_URL}${sep}t=${Date.now()}`, { cache: "no-store" });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const text = await res.text();

                if (text.trim().startsWith("<")) {
                    throw new Error("Fick HTML istället för CSV – kontrollera att arket är publicerat som CSV.");
                }

                const rows = parseCSV(text).filter(r => r.some(c => c.trim() !== ""));
                const header = rows.shift().map(h => h.trim().toLowerCase());
                const col = name => header.indexOf(name);

                const iTicker = col("ticker"), iName = col("namn"), iPrice = col("pris"),
                      iChange = col("ändring"), iPct = col("ändring%"),
                      iBuy = col("inköpspris");

                if ([iTicker, iPrice, iChange, iPct].some(i => i < 0)) {
                    throw new Error("Hittar inte rätt kolumner. Rubrikerna ska vara: Symbol, Ticker, Namn, Pris, Ändring, Ändring%");
                }

                const stocks = rows.map(r => ({
                    ticker: r[iTicker],
                    name: iName >= 0 ? r[iName] : "",
                    buy: iBuy >= 0 ? toNumber(r[iBuy]) : NaN,
                    price: toNumber(r[iPrice]),
                    change: toNumber(r[iChange]),
                    pct: toNumber(r[iPct])
                }));

                renderTable(stocks);
                showError("");
                const now = new Date();
                setStatus(`Uppdaterad ${now.toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit" })}`);
            } catch (err) {
                console.error(err);
                showError(`Kunde inte hämta data: ${escapeHtml(err.message)}`);
                setStatus("");
            } finally {
                btn.disabled = false;
            }
        }

        function renderTable(stocks) {
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Aktie</th>
                            <th class="text-right">Inköpspris</th>
                            <th class="text-right">Senast</th>
                            <th class="text-right">Ändring</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            for (const s of stocks) {
                const nameCell = `
                    <td>
                        <strong>${escapeHtml(s.ticker)}</strong>
                        <span class="ticker-sub" title="${escapeHtml(s.name)}">${escapeHtml(s.name)}</span>
                    </td>
                    <td class="text-right" style="vertical-align: middle;">
                        ${isNaN(s.buy) ? `<span style="color: var(--muted);">–</span>` : `${s.buy.toFixed(2)} kr`}
                    </td>`;

                if (isNaN(s.price)) {
                    html += `<tr>${nameCell}
                        <td colspan="2" class="text-right" style="vertical-align: middle; color: var(--red); font-size: 11px;">
                            Ingen data (kolla symbolen i arket)
                        </td></tr>`;
                    continue;
                }

                const change = isNaN(s.change) ? 0 : s.change;
                const pct = isNaN(s.pct) ? 0 : s.pct;
                const isPos = change >= 0;
                const cls = isPos ? "positive" : "negative";
                const sign = isPos ? "+" : "";

                html += `<tr>${nameCell}
                    <td class="text-right" style="vertical-align: middle;">${s.price.toFixed(2)} kr</td>
                    <td class="text-right" style="vertical-align: middle;">
                        <span class="${cls}">${sign}${change.toFixed(2)}<br>
                        <span style="font-size:11px;">(${sign}${pct.toFixed(2)}%)</span></span>
                    </td></tr>`;
            }

            html += `</tbody></table>`;
            document.getElementById("stock-container").innerHTML = html;
        }

        loadStocks();
        setInterval(loadStocks, AUTO_REFRESH_MS);
    </script>
</body>
</html>
