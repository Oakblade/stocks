<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mina Aktier</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --hover-bg: #f9fafb;
            --green: #10b981;
            --red: #ef4444;
            --muted: #6b7280;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 12px;
            background-color: transparent;
            color: var(--text-color);
            font-size: 13px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .refresh-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            color: var(--muted);
        }
        .refresh-btn:hover {
            background-color: var(--hover-bg);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 6px 4px;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            font-weight: 600;
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
        }
        .text-right {
            text-align: right;
        }
        .positive {
            color: var(--green);
            font-weight: 500;
        }
        .negative {
            color: var(--red);
            font-weight: 500;
        }
        .ticker-sub {
            font-size: 11px;
            color: var(--muted);
            display: block;
            max-width: 110px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .loading, .error {
            text-align: center;
            padding: 20px;
            color: var(--muted);
            font-size: 13px;
        }
        .error {
            color: var(--red);
        }
    </style>
</head>
<body>
    <div class="header">
        <span>Mina Aktier</span>
        <button class="refresh-btn" onclick="fetchStockData(true)">Uppdatera</button>
    </div>
    
    <div id="stock-container">
        <div class="loading">Laddar kurser...</div>
    </div>

    <script>
        const SYMBOLS = "ASSA-B.ST,AXFO.ST,ESSITY-B.ST,HM-B.ST,HNSA.ST,INDU-C.ST,INVE-B.ST,SHB-A.ST,SEYE.ST";
        const CACHE_KEY = "yahoo_stock_data_cache";
        const CACHE_TIME_KEY = "yahoo_stock_data_time";
        const CACHE_DURATION = 5 * 60 * 1000; // 5 minutes cache TTL

        async function fetchStockData(forceRefresh = false) {
            const container = document.getElementById("stock-container");
            const now = new Date().getTime();
            const cachedData = localStorage.getItem(CACHE_KEY);
            const cachedTime = localStorage.getItem(CACHE_TIME_KEY);

            if (!forceRefresh && cachedData && cachedTime && (now - cachedTime < CACHE_DURATION)) {
                renderTable(JSON.parse(cachedData));
                return;
            }

            try {
                const apiUrl = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${encodeURIComponent(SYMBOLS)}`;
                const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(apiUrl)}`;
                
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("Kunde inte nå servern");
                
                const data = await response.json();
                const quotes = data.quoteResponse.result;

                localStorage.setItem(CACHE_KEY, JSON.stringify(quotes));
                localStorage.setItem(CACHE_TIME_KEY, now);

                renderTable(quotes);
            } catch (err) {
                console.error(err);
                if (cachedData) {
                    renderTable(JSON.parse(cachedData));
                } else {
                    container.innerHTML = `<div class="error">Kunde inte ladda kurser. Kontrollera nätverket.</div>`;
                }
            }
        }

        function renderTable(quotes) {
            const container = document.getElementById("stock-container");
            
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Aktie</th>
                            <th class="text-right">Senast</th>
                            <th class="text-right">Ändring</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            quotes.forEach(q => {
                const ticker = q.symbol.replace('.ST', '');
                const name = q.shortName || ticker;
                const price = q.regularMarketPrice !== undefined ? q.regularMarketPrice.toFixed(2) : "-";
                const change = q.regularMarketChange !== undefined ? q.regularMarketChange.toFixed(2) : 0;
                const changePercent = q.regularMarketChangePercent !== undefined ? q.regularMarketChangePercent.toFixed(2) : 0;
                
                const isPos = change >= 0;
                const changeClass = isPos ? "positive" : "negative";
                const sign = isPos ? "+" : "";

                html += `
                    <tr>
                        <td>
                            <strong>${ticker}</strong>
                            <span class="ticker-sub" title="${name}">${name}</span>
                        </td>
                        <td class="text-right" style="vertical-align: middle;">${price} kr</td>
                        <td class="text-right" style="vertical-align: middle;" class="${changeClass}">
                            <span class="${changeClass}">${sign}${change}<br><span style="font-size:11px;">(${sign}${changePercent}%)</span></span>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // Run on load
        fetchStockData();
    </script>
</body>
</html>
